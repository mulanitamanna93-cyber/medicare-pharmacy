<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | MediCare Pharmacy</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        .orders-page {
            background: #f7faf9;
            min-height: 75vh;
            padding: 45px 0 70px;
        }

        .orders-title {
            margin-bottom: 25px;
        }

        .orders-title h1 {
            color: #083f3a;
            font-size: 30px;
            margin-bottom: 7px;
        }

        .orders-title p {
            color: #7c8986;
            font-size: 11px;
        }

        .orders-list {
            display: grid;
            gap: 18px;
        }

        .order-card {
            background: white;
            border: 1px solid #e1ebe8;
            border-radius: 14px;
            overflow: hidden;
        }

        .order-header {
            padding: 17px 20px;
            background: #f7fbfa;
            border-bottom: 1px solid #e8efed;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .order-header-left strong {
            display: block;
            color: #083f3a;
            font-size: 12px;
        }

        .order-header-left span {
            display: block;
            color: #899592;
            font-size: 9px;
            margin-top: 4px;
        }

        .status {
            background: #e5f8f3;
            color: #0a927e;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 9px;
            font-weight: 700;
        }

        .order-body {
            padding: 20px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 9px 0;
            border-bottom: 1px solid #edf2f1;
            gap: 15px;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-name {
            color: #405a56;
            font-size: 10px;
        }

        .order-item-qty {
            color: #909c99;
            font-size: 9px;
            margin-top: 3px;
        }

        .order-item-price {
            color: #083f3a;
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .order-footer {
            border-top: 1px solid #e8efed;
            padding: 17px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .payment-text {
            color: #7c8986;
            font-size: 9px;
        }

        .payment-text strong {
            color: #405a56;
        }

        .order-total {
            color: #10a48f;
            font-size: 17px;
            font-weight: 800;
        }

        .empty-orders {
            background: white;
            border: 1px solid #e1ebe8;
            border-radius: 15px;
            text-align: center;
            padding: 75px 20px;
        }

        .empty-orders-icon {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: #e8f8f5;
            color: #10a48f;
            display: grid;
            place-items: center;
            margin: 0 auto 17px;
            font-size: 27px;
        }

        .empty-orders h2 {
            color: #083f3a;
            font-size: 20px;
            margin-bottom: 7px;
        }

        .empty-orders p {
            color: #7c8986;
            font-size: 10px;
            margin-bottom: 20px;
        }

        .shop-btn {
            display: inline-block;
            background: #10a48f;
            color: white;
            text-decoration: none;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
        }

        @media(max-width:600px) {

            .orders-page {
                padding: 30px 0 50px;
            }

            .orders-title h1 {
                font-size: 26px;
            }

            .order-header,
            .order-footer {
                align-items: flex-start;
                flex-direction: column;
            }

            .order-total {
                align-self: flex-end;
            }
        }

    </style>

</head>


<body>


<header class="cart-header">

    <div class="container header-flex">

        <a href="index.html" class="logo">

            <span class="logo-icon">
                <i class="fa-solid fa-plus"></i>
            </span>

            <span>
                <strong>MediCare</strong>
                <small>PHARMACY</small>
            </span>

        </a>

        <a href="medicines.html" class="back-link">
            <i class="fa-solid fa-plus"></i>
            Shop Medicines
        </a>

    </div>

</header>


<main class="orders-page">

    <div class="container">

        <div class="orders-title">

            <h1>My Orders</h1>

            <p>
                View your previous MediCare Pharmacy orders.
            </p>

        </div>


        <div id="ordersContainer"></div>

    </div>

</main>


<script>


let orders =
    JSON.parse(
        localStorage.getItem("medicareOrders")
    ) || [];


const container =
    document.getElementById(
        "ordersContainer"
    );


function formatPayment(payment) {

    if (payment === "cod") {
        return "Cash on Delivery";
    }

    if (payment === "upi") {
        return "UPI";
    }

    if (payment === "card") {
        return "Card Payment";
    }

    return "-";

}


function displayOrders() {


    if (orders.length === 0) {

        container.innerHTML = `

            <div class="empty-orders">

                <div class="empty-orders-icon">

                    <i class="fa-solid fa-receipt"></i>

                </div>

                <h2>No Orders Yet</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a
                    href="medicines.html"
                    class="shop-btn"
                >
                    Browse Medicines
                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div class="orders-list">

            ${orders.map(function(order) {

                return `

                    <div class="order-card">

                        <div class="order-header">

                            <div class="order-header-left">

                                <strong>
                                    Order ID: ${order.orderId}
                                </strong>

                                <span>
                                    ${order.date}
                                </span>

                            </div>

                            <span class="status">
                                Order Placed
                            </span>

                        </div>


                        <div class="order-body">

                            ${order.items.map(function(item) {

                                const price =
                                    Number(item.price) || 0;

                                const quantity =
                                    Number(item.quantity) || 1;

                                return `

                                    <div class="order-item">

                                        <div>

                                            <div class="order-item-name">
                                                ${item.name}
                                            </div>

                                            <div class="order-item-qty">
                                                Quantity: ${quantity}
                                            </div>

                                        </div>

                                        <div class="order-item-price">
                                            ₹${price * quantity}
                                        </div>

                                    </div>

                                `;

                            }).join("")}

                        </div>


                        <div class="order-footer">

                            <div class="payment-text">

                                Payment:
                                <strong>
                                    ${formatPayment(order.payment)}
                                </strong>

                            </div>

                            <div class="order-total">

                                ₹${order.total || 0}

                            </div>

                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


displayOrders();


</script>


</body>
</html>
